
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QCC Baked Voucher Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5fb;
      max-width: 440px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 { color: #8e44ad; text-align: center; }
    p { text-align: center; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #8e44ad;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { background: #aaa; }
    #reader { width: 100%; margin-top: 16px; }
    #result {
      margin-top: 18px;
      padding: 14px;
      background: white;
      border-radius: 10px;
      overflow-wrap: anywhere;
      text-align: center;
    }
    #code {
      font-size: 24px;
      font-weight: bold;
      color: #8e44ad;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>QCC Baked</h2>
  <p>Voucher QR Scanner</p>

  <button id="startButton" onclick="startScanner()">
    Start Camera Scanner
  </button>

  <div id="reader"></div>

  <div id="result" role="status">
    Tap Start Camera Scanner to scan a voucher.
  </div>

  <div id="code"></div>

  <button id="copyButton" onclick="copyCode()" disabled>
    Copy Voucher Code
  </button>

  <button onclick="startScanner()">
    Scan Again
  </button>

  <p>After copying, return to the voucher app and paste the code.</p>

  <script>
    let scanner = null;
    let isRunning = false;
    let scannedCode = "";

    async function startScanner() {
      const result = document.getElementById("result");
      const codeDisplay = document.getElementById("code");
      const copyButton = document.getElementById("copyButton");

      if (isRunning) {
        result.textContent = "Camera is already running.";
        return;
      }

      scannedCode = "";
      codeDisplay.textContent = "";
      copyButton.disabled = true;
      result.textContent = "Opening camera...";

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async function(decodedText) {
            if (!isRunning) return;

            scannedCode = decodedText;
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(
              {
                type: "QCC_VOUCHER_SCANNED",
                code: decodedText
              },
              "https://script.google.com"
              );
            }
            isRunning = false;

            try {
              await scanner.stop();
            } catch (error) {}

            result.textContent = "Voucher code scanned successfully:";
            result.textContent += window.opener
            ? " | Opener detected"
            : " | Opener missing";
            codeDisplay.textContent = scannedCode;
            result.textContent += window.opener
            ? " | Connection available"
            : " | No connection to voucher app";
            copyButton.disabled = false;
          },
          function() {}
        );

        isRunning = true;
        result.textContent = "Camera ready. Point it at the voucher QR code.";
      } catch (error) {
        isRunning = false;
        result.textContent =
          "Could not open camera. Please allow camera access and try again.";
      }
    }

    async function copyCode() {
      if (!scannedCode) return;

      try {
        await navigator.clipboard.writeText(scannedCode);
        document.getElementById("result").textContent =
          "Code copied! Return to the voucher app and paste it.";
      } catch (error) {
        document.getElementById("result").textContent =
          "Automatic copy failed. Please select and copy the code manually.";
      }
    }
  </script>
</body>
</html>
